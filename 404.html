<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Enjeu">
  <link rel="manifest" href="/site.webmanifest">
  <title>Not found | Enjeu</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="https://cdn.neorgon.org/v1.0.0/styles/base.css">
  <style>
    /* Self-contained on purpose. A 404 that depends on the site's own CSS
       bundle breaks exactly when something is already wrong with the paths. */
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center;
      background: #0a0a12; color: #f4f4f8; text-align: center;
      font-family: 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
      padding: 2rem;
    }
    .code { font-size: clamp(4rem, 18vw, 9rem); font-weight: 800; line-height: 1;
            margin: 0; color: #E326E4; letter-spacing: -.04em; }
    h1 { font-size: clamp(1.1rem, 4vw, 1.5rem); font-weight: 600; margin: .75rem 0 .35rem; }
    p  { color: rgba(255,255,255,.62); margin: 0 0 1.75rem; max-width: 34ch; }
    a  { display: inline-block; padding: .7rem 1.4rem; border-radius: 8px;
         background: #E326E4; color: #fff; text-decoration: none; font-weight: 600; }
    a:hover { filter: brightness(1.1); }
    a + a { margin-left: .6rem; background: transparent; color: rgba(255,255,255,.72);
            border: 1px solid rgba(255,255,255,.18); }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1 data-en="That page is not here" data-es="Esa página no está acá">That page is not here</h1>
    <p data-en="The link may be old, or the address may have a typo in it."
       data-es="El enlace puede ser viejo, o la dirección puede tener un error.">The link may be old, or the address may have a typo in it.</p>
    <a href="/" data-en="Back to Enjeu" data-es="Volver a Enjeu">Back to Enjeu</a>
    <a href="https://neorgon.com" data-en="All tools" data-es="Todas las herramientas">All tools</a>
  </main>
  <script>
    /* Self-contained, like the CSS above and for the same reason: a 404 that
       imports the site's modules breaks exactly when the paths are already
       broken. It reads the same localStorage key the app persists the language
       in, so a Spanish visitor who mistypes a URL still lands in Spanish. */
    try {
      var saved = JSON.parse(localStorage.getItem('enjeu-state') || '{}');
      var lang = saved && saved.lang === 'es' ? 'es' : 'en';
      if (lang === 'es') {
        document.documentElement.lang = 'es';
        document.title = 'No encontrado | Enjeu';
        document.querySelectorAll('[data-es]').forEach(function (el) { el.textContent = el.dataset.es; });
      }
    } catch (e) { /* an unreadable store just leaves the page in English */ }
  </script>
</body>
</html>
