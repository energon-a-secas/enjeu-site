<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Enjeu">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="neo-mark" content="on">
  <title>Enjeu | Boss-rush card game</title>
  <meta name="description" content="Print 110 cards, grab one die and the bricks and figures you already own, then play a solo boss rush where the same cards are your attack and your defense">
  <meta property="og:title" content="Enjeu: Boss-rush card game">
  <meta property="og:description" content="Print the cards, grab one die and your own bricks. Balance your attack and your defense.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://enjeu.neorgon.com/">
  <meta property="og:site_name" content="Neorgon">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Enjeu: Boss-rush card game">
  <meta name="twitter:description" content="Print the cards, grab one die and your own bricks. Balance your attack and your defense.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://enjeu.neorgon.com/">
  <meta property="og:locale" content="en_US">
  <meta name="theme-color" content="#eab308">
  <meta property="og:image" content="https://enjeu.neorgon.com/og-preview.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Enjeu">
  <meta name="twitter:image" content="https://enjeu.neorgon.com/og-preview.jpg">
  <!-- Print-and-play light dialect: the page carries its own tokens (see DESIGN.md),
       so the CDN base.css is deliberately not linked. -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/cards.css">
  <!-- One stylesheet per view, after the shared tokens and primitives. A view's
       own blocks live in its own file so a change to the tutorial cannot reach
       the runner; anything two views share stays in style.css. -->
  <link rel="stylesheet" href="css/learn.css">
  <link rel="stylesheet" href="css/browse.css">
  <link rel="stylesheet" href="css/about.css">
  <link rel="stylesheet" href="css/play.css">
  <link rel="stylesheet" href="css/print.css">
  <!-- Neorgon Header Kit (vendored). Keep after the site styles; the kit owns the header. -->
  <script>(function(){var m=location.search.match(/[?&]theme=([\w-]+)/)||document.cookie.match(/(?:^|;\s*)neo_theme=([\w-]+)/);if(m&&m[1]!=='default')document.documentElement.dataset.theme=decodeURIComponent(m[1]);})();</script>
  <link rel="stylesheet" href="css/neorgon-header.css">
  <link rel="stylesheet" href="css/neorgon-themes.css">
  <link rel="stylesheet" href="https://cdn.neorgon.org/v1.0.0/header/season.css">
  <script defer src="js/neorgon-header.js"></script>
  <!-- Neorgon Footer Kit (vendored). -->
  <meta name="neo-repo" content="energon-a-secas/enjeu-site">
  <link rel="stylesheet" href="css/neorgon-footer.css">
  <script defer src="js/neorgon-footer.js"></script>
  <meta name="neo-version" content="v1.1.0">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Enjeu",
    "description": "A print-and-play boss-rush card game for one player, one die, and the construction-toy bricks and figures you already own. Rules, printable cards, and an in-browser simulator.",
    "url": "https://enjeu.neorgon.com/",
    "applicationCategory": "GameApplication",
    "operatingSystem": "Any",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "author": { "@type": "Organization", "name": "Neorgon", "url": "https://neorgon.com/" }
  }
  </script>
</head>
<body>

  <a class="skip-link" href="#main" data-i18n="chrome.skip">Skip to content</a>

  <header class="header-bar" data-header-mode="content" data-header-skin="custom">
    <div class="header-logo">
      <a href="#/learn" class="header-title-link">
        <img src="https://cdn.neorgon.org/v1.0.0/energon-classic-logo.png" class="header-logo-img" alt="">
        <div class="header-title-wrap">
        <h1>Enjeu</h1>
        <div class="header-subtitle" data-i18n="chrome.subtitle">Balance your attack and your defense</div>
      
        </div>
      </a>
    </div>

    <div class="header-right">
      <!-- The nav is a CHILD of .header-actions (pieza learned this the hard way: the kit
           builds its overflow container inside .header-actions, and a nav that IS
           .header-actions deletes it on first render). data-keep-mobile keeps the four
           tabs on the bar; the row scrolls sideways when the bar is narrow. -->
      <div class="header-actions">
        <nav class="sk-nav" id="skNav" role="tablist" aria-label="Sections" data-i18n-label="chrome.sections" data-keep-mobile></nav>
        <!-- Language. Static markup, because it sits outside #viewRoot and render.js
             never touches it: js/events.js sets the pressed button and <html lang>.
             The two labels are language codes, so they read the same in both and
             nothing here needs translating. data-keep-mobile because a bilingual
             reader switching mid-sentence should not have to open a menu first. -->
        <div class="seg seg--lang" role="group" aria-label="Language / Idioma" data-keep-mobile>
          <button type="button" data-action="lang" data-lang="en" aria-pressed="true" lang="en">EN</button>
          <button type="button" data-action="lang" data-lang="es" aria-pressed="false" lang="es">ES</button>
        </div>
      </div>
      <a class="header-home" href="https://neorgon.com/" title="neorgon.com" aria-label="Neorgon home">
        <svg class="nh-hub-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="12" cy="12" r="4.4"/>
          <ellipse cx="12" cy="12" rx="8.4" ry="3" transform="rotate(-18 12 12)"/>
          <g class="nh-orbit">
            <path d="M17.5 4.2 14.2 2.7l.9 1.4-.6 1.1z" fill="currentColor" stroke="none"/>
            <circle cx="12.6" cy="3" r=".7" fill="currentColor" stroke="none" opacity=".55"/>
            <circle cx="11.1" cy="3.3" r=".55" fill="currentColor" stroke="none" opacity=".35"/>
            <circle cx="9.8" cy="3.7" r=".4" fill="currentColor" stroke="none" opacity=".2"/>
          </g>
        </svg>
      </a>
    </div>
  </header>

  <main id="main">
    <div id="viewRoot" class="view-root"><!-- rendered by js/render.js --></div>
  </main>

  <!-- Card detail sheet (Cards view): filled by views/cards.js, one landmark. -->
  <div class="modal" id="cardModal" hidden>
    <div class="modal__backdrop" data-modal-close tabindex="-1" aria-hidden="true"></div>
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="cardModalTitle" tabindex="-1">
      <header class="modal__header">
        <h2 id="cardModalTitle">Card</h2>
        <button type="button" class="btn btn--ghost btn--icon" data-modal-close aria-label="Close dialog" data-i18n-label="chrome.closeDialog">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </header>
      <div class="modal__body" id="cardModalBody"></div>
    </div>
  </div>

  <!-- Print root: filled on demand by js/cards/sheet.js, visible only in @media print. -->
  <div class="print-sheet" id="printSheet" aria-hidden="true"></div>

  <footer class="neo-footer" data-footer-mode="minimal">
    <!-- A span, not a bare text node: js/events.js rewrites it on a language
         switch, and the footer kit MOVES loose children into .neo-footer-inner
         rather than cloning them, so the element it is holding stays the one
         on the page. -->
    <span data-i18n="chrome.footerNote">Rules and cards are MIT. Card art is CC BY, credited on the About page. Runs save on this device only.</span>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
